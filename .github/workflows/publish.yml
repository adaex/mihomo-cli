name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: npm Trusted Publishing
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run prepublishOnly

      - name: Pack and verify release tarball
        env:
          MIHOMO_CLI_DIR: /tmp/mihomo-cli-release-${{ github.run_id }}
          MIHOMO_CLI_DAEMON_LABEL: com.mihomo-cli.release-${{ github.run_id }}
          NO_COLOR: '1'
        run: |
          tarball="$RUNNER_TEMP/$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          unpacked="$(mktemp -d "$RUNNER_TEMP/mihomo-cli.XXXXXX")"
          tar -xzf "$tarball" -C "$unpacked"
          cd "$unpacked/package"
          ls dist/index.js README.md LICENSE CHANGELOG.md SECURITY.md docs/overwrite.md package.json
          output="$(node dist/index.js version)"
          printf '%s\n' "$output"
          grep -Fxq "mihomo-cli $GITHUB_REF_NAME" <<< "$output"
          printf 'RELEASE_TARBALL=%s\n' "$tarball" >> "$GITHUB_ENV"

      - name: Publish with npm Trusted Publishing
        run: npm publish "$RELEASE_TARBALL"

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY' > /tmp/release-notes.md
          import os
          import re

          version = os.environ['VERSION'].removeprefix('v')
          lines = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
          starts = [i for i, line in enumerate(lines) if re.match(r'^## \[', line)]
          begin = next(i for i in starts if lines[i].startswith(f'## [{version}]'))
          end = next((i for i in starts if i > begin), len(lines))
          print('\n'.join(lines[begin + 1:end]).strip())
          PY
          gh release create "${VERSION}" --title "${VERSION}" --notes-file /tmp/release-notes.md --verify-tag
